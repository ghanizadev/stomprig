[package]
name = "rack"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rack"
path = "./src/bin/main.rs"

[[bin]]
name = "vst3-host-helper"
path = "vendor/vst3-host/src/bin/vst3-host-helper.rs"

[[bin]]
name = "vst3-host-probe"
path = "vendor/vst3-host/src/bin/vst3-host-probe.rs"

[dependencies]
log = "0.4.34"
simplelog = "0.12"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61.2"
features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Kernel", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"]

[target.'cfg(unix)'.dependencies.libc]
version = "0.2"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.toml]
version = "0.9"

[dependencies.serde_json]
version = "1"

[dependencies.egui]
version = "=0.33.3"

[dependencies.ecolor]
version = "0.33.3"

[dependencies.eframe]
version = "=0.33.3"

[dependencies.glow]
version = "0.16.0"

[dependencies.vst3-host]
version = "0.9.0"
features = ["egui-widgets", "midi-input"]

[patch.crates-io]
cpal = { path = "vendor/cpal" }
vst3-host = { path = "vendor/vst3-host" }

[dependencies.raw-window-handle]
version = "0.6"

[dependencies.cpal]
version = "0.18"

[target.'cfg(windows)'.dependencies.cpal]
version = "0.18"
features = ["asio"]

[target.'cfg(target_os = "linux")'.dependencies.cpal]
version = "0.18"
features = ["jack", "pipewire"]

[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.6"

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3.2"
features = [
    "NSApplication",
    "NSWindow",
    "NSView",
    "NSResponder",
    "NSGraphics",
    "NSEvent",
]

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3"
features = [
    "NSString",
    "NSGeometry",
    "NSDate",
    "NSRunLoop",
]

[dependencies.rfd]
version = "0.15.4"

[dependencies.rodio]
version = "0.22.2"
default-features = false
features = ["mp3", "wav"]

[dependencies.rtrb]
version = "0.3"

[dependencies.egui-shadcn]
version = "0.5.0"

[dependencies.lucide-icons]
version = "0.575.0"
