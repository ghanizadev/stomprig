[package]
name = "rack"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rack"
path = "./src/bin/main.rs"

[dependencies]
log = "0.4.34"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.toml]
version = "0.9"

[dependencies.egui]
version = "0.36.2"

[dependencies.ecolor]
version = "0.33.3"

[dependencies.eframe]
version = "0.36.2"

[dependencies.vst3-host]
version = "0.9.0"
features = ["egui-widgets"]

[dependencies.raw-window-handle]
version = "0.6"

[dependencies.cpal]
version = "0.18"
features = ["asio"]

[dependencies.rtrb]
version = "0.3"

[dependencies.egui-shadcn]
version = "0.5.0"
