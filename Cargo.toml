[package]
name = "rack"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rack"
path = "./src/bin/main.rs"

[dependencies]
log = "0.4.34"
simplelog = "0.12"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Kernel", "Win32_System_Memory", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.toml]
version = "0.9"

[dependencies.egui]
version = "=0.33.3"

[dependencies.ecolor]
version = "0.33.3"

[dependencies.eframe]
version = "=0.33.3"

[dependencies.glow]
version = "0.16.0"

[dependencies.vst3-host]
version = "0.9.0"
features = ["egui-widgets"]

[dependencies.raw-window-handle]
version = "0.6"

[dependencies.cpal]
version = "0.18"
features = ["asio"]

[dependencies.rtrb]
version = "0.3"

[dependencies.egui-shadcn]
version = "0.5.0"

[dependencies.lucide-icons]
version = "0.575.0"
