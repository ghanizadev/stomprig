name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate_tag:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.semver.outputs.version }}
      is_stable: ${{ steps.semver.outputs.is_stable }}
    steps:
      - name: Parse semantic version tag
        id: semver
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          semver_regex='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "${tag}" =~ ${semver_regex} ]]; then
            echo "Release tag '${tag}' must use vMAJOR.MINOR.PATCH SemVer." >&2
            exit 1
          fi

          version="${tag#v}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          version_without_build="${version%%+*}"
          if [[ "${version_without_build}" == *-* ]]; then
            echo "is_stable=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Prerelease tag '${tag}' is excluded from app releases and updates."
          else
            echo "is_stable=true" >> "${GITHUB_OUTPUT}"
          fi

  build:
    name: Build (${{ matrix.platform }})
    needs: validate_tag
    if: needs.validate_tag.outputs.is_stable == 'true'
    runs-on: ${{ matrix.os }}
    env:
      STOMPRIG_BUILD_VERSION: ${{ needs.validate_tag.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            archive: stomprig-windows.zip
          - platform: Linux
            os: ubuntu-24.04
            archive: stomprig-linux.tar.gz
          - platform: macOS
            os: macos-latest
            archive: stomprig-macos.tar.gz
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libasound2-dev libjack-jackd2-dev libpipewire-0.3-dev

      - name: Install LLVM for ASIO bindings
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm --yes --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install .NET SDK for Velopack
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build and verify release package
        shell: bash
        env:
          STOMPRIG_PACKAGE_DIR: dist/stomprig
        run: bash scripts/package-release.sh

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/stomprig -DestinationPath "dist/${{ matrix.archive }}"

      - name: Create Unix archive
        if: runner.os != 'Windows'
        run: tar -czf "dist/${{ matrix.archive }}" -C dist stomprig

      - name: Create Velopack release package
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate_tag.outputs.version }}
        run: |
          dotnet tool install --tool-path "${RUNNER_TEMP}/vpk" vpk
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            pack_id="stomprig-win"
            channel="win"
            main_exe="stomprig.exe"
            vpk="${RUNNER_TEMP}/vpk/vpk.exe"
          elif [[ "${RUNNER_OS}" == "macOS" ]]; then
            pack_id="stomprig-osx"
            channel="osx"
            main_exe="stomprig"
            vpk="${RUNNER_TEMP}/vpk/vpk"
          else
            pack_id="stomprig-linux"
            channel="linux"
            main_exe="stomprig"
            vpk="${RUNNER_TEMP}/vpk/vpk"
          fi

          mkdir -p dist/velopack
          "${vpk}" pack \
            --packId "${pack_id}" \
            --packVersion "${RELEASE_VERSION}" \
            --packDir dist/stomprig \
            --mainExe "${main_exe}" \
            --packTitle StompRig \
            --channel "${channel}" \
            --outputDir dist/velopack

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: stomprig-${{ matrix.platform }}
          path: |
            dist/${{ matrix.archive }}
            dist/velopack/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: [validate_tag, build]
    if: needs.validate_tag.outputs.is_stable == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: stomprig-*
          path: dist
          merge-multiple: true

      - name: Publish stable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/stomprig-* dist/velopack/* --verify-tag --generate-notes
